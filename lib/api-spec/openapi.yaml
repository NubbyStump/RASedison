openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: pairing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pairing/create:
    post:
      operationId: createPairing
      tags: [pairing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingCreateInput" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /pairing/join:
    post:
      operationId: joinPairing
      tags: [pairing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingJoinInput" }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Legacy room cannot accept new members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: Room has ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /pairing/session:
    get:
      operationId: getPairingSession
      tags: [pairing]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /pairing/assignment:
    patch:
      operationId: updatePairingAssignment
      tags: [pairing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingAssignmentInput" }
      responses:
        "200":
          description: Updated current member assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /pairing/command:
    post:
      operationId: sendPairingCommand
      tags: [pairing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingCommandInput" }
      responses:
        "200":
          description: Updated or idempotently replayed session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /pairing/message:
    delete:
      operationId: clearPairingMessage
      tags: [pairing]
      security: [{ bearerAuth: [] }]
      description: Owner-only dismissal of all current projector messages, without changing session activity or scoreboard data.
      responses:
        "200":
          description: Updated session with no projector messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: sendPairingMessage
      tags: [pairing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingMessageInput" }
      responses:
        "200":
          description: Message broadcast or idempotently replayed session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /pairing/rotate-code:
    post:
      operationId: rotatePairingCode
      tags: [pairing]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /pairing/remove-member:
    post:
      operationId: removePairingMember
      tags: [pairing]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairingMemberRemovalInput" }
      responses:
        "200":
          description: Counselor membership revoked and updated session returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pairing/leave:
    post:
      operationId: leavePairing
      tags: [pairing]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /pairing/end:
    post:
      operationId: endPairing
      tags: [pairing]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Room ended and all memberships revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    BadRequest:
      description: Malformed input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Invalid authentication
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    OkResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean }
    Group:
      type: object
      required: [id, name, score]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 100 }
        score: { type: number, minimum: 0, maximum: 1000000000 }
        color: { type: string, maxLength: 200 }
        badgeColor: { type: string, maxLength: 200 }
        icon: { type: string, maxLength: 30 }
    HistoryEntry:
      type: object
      required: [id, groupId, groupName, amount, reason, timestamp]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        groupId: { type: string, minLength: 1, maxLength: 80 }
        groupName: { type: string, minLength: 1, maxLength: 100 }
        amount: { type: number, minimum: -1000000000, maximum: 1000000000 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        submittedByName: { type: string, minLength: 1, maxLength: 60 }
        specialMentions: { type: string, maxLength: 500 }
        timestamp: { type: string, minLength: 1, maxLength: 100 }
    LapRecord:
      type: object
      required: [id, runnerName, group, minutes, seconds, ms, timeFormatted, totalSeconds, courseName, date, monthYear]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        runnerName: { type: string, minLength: 1, maxLength: 100 }
        group: { type: string, minLength: 1, maxLength: 100 }
        minutes: { type: integer, minimum: 0, maximum: 999 }
        seconds: { type: integer, minimum: 0, maximum: 59 }
        ms: { type: integer, minimum: 0, maximum: 99 }
        timeFormatted: { type: string, minLength: 1, maxLength: 30 }
        totalSeconds: { type: number, minimum: 0, maximum: 100000 }
        courseName: { type: string, minLength: 1, maxLength: 200 }
        date: { type: string, minLength: 1, maxLength: 30 }
        monthYear: { type: string, minLength: 1, maxLength: 100 }
    MonthlyRecord:
      type: object
      required: [id, month, winner, scores, rewardClaimed]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        month: { type: string, minLength: 1, maxLength: 100 }
        winner: { type: string, minLength: 1, maxLength: 500 }
        scores: { type: string, maxLength: 2000 }
        rewardClaimed: { type: boolean }
    Activity:
      type: object
      required: [id, title, type, points, location]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 300 }
        type: { type: string, minLength: 1, maxLength: 100 }
        points: { type: number, minimum: -1000000, maximum: 1000000 }
        location: { type: string, minLength: 1, maxLength: 100 }
        scrambledPhrase: { type: string, maxLength: 2000 }
        solvedPhrase: { type: string, maxLength: 2000 }
        hint: { type: string, maxLength: 2000 }
        lesson: { type: string, maxLength: 5000 }
        materials: { type: string, maxLength: 5000 }
        steps: { type: string, maxLength: 10000 }
        harder: { type: string, maxLength: 5000 }
        safety: { type: string, maxLength: 5000 }
    PairingState:
      type: object
      additionalProperties: false
      required: [groups, history, lapRecords, monthlyRecords, activities]
      properties:
        groups:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Group" }
        history:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/HistoryEntry" }
        lapRecords:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/LapRecord" }
        monthlyRecords:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/MonthlyRecord" }
        activities:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/Activity" }
        pendingPointApprovals:
          type: array
          description: Point proposals and bounded approval outcomes. Omitted in rooms created before approvals were introduced.
          items: { $ref: "#/components/schemas/PointApproval" }
    PointApproval:
      type: object
      additionalProperties: false
      required: [id, groupId, groupName, amount, reason, submittedById, submittedByName, submittedAt, dueAt, status]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, minLength: 1, maxLength: 80 }
        groupName: { type: string, minLength: 1, maxLength: 100 }
        amount: { type: number }
        reason: { type: string, minLength: 1, maxLength: 500 }
        specialMentions: { type: string, maxLength: 500 }
        submittedById: { type: string, format: uuid }
        submittedByName: { type: string, minLength: 1, maxLength: 60 }
        submittedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, approved, rejected, autoApproved] }
        resolvedAt: { type: string, format: date-time }
    Member:
      type: object
      additionalProperties: false
      required: [id, name, role, groupId, assignmentDate]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        role: { type: string, enum: [owner, counselor] }
        groupId: { type: ["string", "null"], minLength: 1, maxLength: 80 }
        assignmentDate: { type: ["string", "null"], pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$" }
    ProjectorMessage:
      type: object
      additionalProperties: false
      required: [id, text, senderName, senderRole, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 240 }
        senderId:
          type: string
          format: uuid
          description: Server-owned sender member ID. Absent on messages created before sender identity tracking.
        senderName: { type: string, minLength: 1, maxLength: 60 }
        senderRole: { type: string, enum: [owner, counselor] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Session:
      type: object
      additionalProperties: false
      required: [roomId, code, role, memberId, groupId, assignmentDate, version, timeZone, activitiesMonth, state, members, projectorMessages, chatMessages]
      properties:
        roomId: { type: string, format: uuid }
        code: { type: string, pattern: "^[A-Za-z0-9]{10}$" }
        role: { type: string, enum: [owner, counselor] }
        memberId: { type: string, format: uuid }
        groupId: { type: ["string", "null"], minLength: 1, maxLength: 80 }
        assignmentDate: { type: ["string", "null"], pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$" }
        version: { type: integer, minimum: 1 }
        timeZone:
          type: string
          description: IANA timezone used for the room's school calendar month (America/Los_Angeles by default).
        activitiesMonth:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
          description: Calendar month for which missions and Super Scrambles are current.
        state: { $ref: "#/components/schemas/PairingState" }
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        projectorMessages:
          type: array
          maxItems: 20
          description: Unexpired projector broadcasts, sorted oldest to newest. New messages expire 8 seconds after creation.
          items: { $ref: "#/components/schemas/ProjectorMessage" }
        chatMessages:
          type: array
          maxItems: 100
          description: Retained recent chat messages, including messages whose projector display has expired, sorted oldest to newest.
          items: { $ref: "#/components/schemas/ProjectorMessage" }
        token: { type: string, minLength: 32 }
    PairingCreateInput:
      type: object
      additionalProperties: false
      required: [name, password, state, groupId, assignmentDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        password: { type: string, minLength: 4, maxLength: 128 }
        state: { $ref: "#/components/schemas/PairingState" }
        groupId: { type: ["string", "null"], minLength: 1, maxLength: 80 }
        assignmentDate: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$" }
    PairingJoinInput:
      type: object
      additionalProperties: false
      required: [name, password, code, groupId, assignmentDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        password: { type: string, minLength: 4, maxLength: 128 }
        code: { type: string, pattern: "^[A-Za-z0-9]{10}$" }
        groupId: { type: string, minLength: 1, maxLength: 80 }
        assignmentDate: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$" }
    PairingAssignmentInput:
      type: object
      additionalProperties: false
      required: [groupId, assignmentDate]
      properties:
        groupId: { type: ["string", "null"], minLength: 1, maxLength: 80 }
        assignmentDate: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$" }
    PairingMemberRemovalInput:
      type: object
      additionalProperties: false
      required: [memberId]
      properties:
        memberId: { type: string, format: uuid }
    PairingMessageInput:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id: { type: string, format: uuid }
        text:
          type: string
          minLength: 1
          maxLength: 240
          description: Plain text; surrounding whitespace is trimmed by the server.
    PairingCommandInput:
      oneOf:
        - $ref: "#/components/schemas/AddPointsCommand"
        - $ref: "#/components/schemas/ReduceGroupPointsCommand"
        - $ref: "#/components/schemas/ApprovePointsCommand"
        - $ref: "#/components/schemas/RejectPointsCommand"
        - $ref: "#/components/schemas/UndoCommand"
        - $ref: "#/components/schemas/ResetMonthCommand"
        - $ref: "#/components/schemas/SaveLapCommand"
        - $ref: "#/components/schemas/DeleteLapCommand"
        - $ref: "#/components/schemas/AddActivityCommand"
        - $ref: "#/components/schemas/DeleteActivityCommand"
        - $ref: "#/components/schemas/ClearActivitiesCommand"
        - $ref: "#/components/schemas/ToggleRewardCommand"
    AddPointsCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [addPoints] }
        payload:
          type: object
          additionalProperties: false
          required: [groupId, amount, reason]
          properties:
            groupId: { type: string, minLength: 1, maxLength: 80 }
            amount: { type: number, minimum: -1000000, maximum: 1000000 }
            reason: { type: string, minLength: 1, maxLength: 500 }
            specialMentions: { type: string, maxLength: 500 }
    ReduceGroupPointsCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [reduceGroupPoints] }
        payload:
          type: object
          additionalProperties: false
          required: [groupId, mode, reason]
          properties:
            groupId: { type: string, minLength: 1, maxLength: 80 }
            mode: { type: string, enum: [half, all] }
            reason: { type: string, minLength: 1, maxLength: 500 }
            specialMentions: { type: string, maxLength: 500 }
    ApprovePointsCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [approvePoints] }
        payload:
          type: object
          additionalProperties: false
          required: [requestId]
          properties:
            requestId: { type: string, format: uuid }
    RejectPointsCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [rejectPoints] }
        payload:
          type: object
          additionalProperties: false
          required: [requestId]
          properties:
            requestId: { type: string, format: uuid }
    UndoCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [undo] }
        payload:
          type: object
          additionalProperties: false
          required: [logId]
          properties:
            logId: { type: string, minLength: 1, maxLength: 80 }
    ResetMonthCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [resetMonth] }
        payload:
          type: object
          additionalProperties: false
          required: [month]
          properties:
            month: { type: string, minLength: 1, maxLength: 100 }
    SaveLapCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [saveLap] }
        payload:
          type: object
          additionalProperties: false
          required: [record]
          properties:
            record: { $ref: "#/components/schemas/LapRecord" }
    DeleteLapCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [deleteLap] }
        payload:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: { type: string, minLength: 1, maxLength: 80 }
    AddActivityCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [addActivity] }
        payload:
          type: object
          additionalProperties: false
          required: [activity]
          properties:
            activity: { $ref: "#/components/schemas/Activity" }
    DeleteActivityCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [deleteActivity] }
        payload:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: { type: string, minLength: 1, maxLength: 80 }
    ClearActivitiesCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [clearActivities] }
        payload:
          type: object
          additionalProperties: false
    ToggleRewardCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [toggleReward] }
        payload:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: { type: string, minLength: 1, maxLength: 80 }